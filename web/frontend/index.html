<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everything2MD - 文档转换工具</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- File Picker Modal -->
        <div id="filePickerModal" class="modal-overlay">
            <div class="modal">
                <div class="modal-header">
                    <h3 class="modal-title">选择文件/文件夹</h3>
                    <button class="modal-close" onclick="closeFilePicker()">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="current-path-container">
                        <button onclick="navigateUp()" id="btnUpLevel" class="btn btn-secondary">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
                            上一级
                        </button>
                        <input type="text" id="currentPathInput" readonly>
                    </div>
                    <div class="file-list" id="fileList">
                        <!-- File items will be injected here -->
                    </div>
                </div>
                <div class="modal-footer">
                    <span id="selectedItemDisplay"></span>
                    <button class="btn btn-secondary" onclick="closeFilePicker()">取消</button>
                    <button class="btn btn-primary" onclick="confirmSelection()">确定</button>
                </div>
            </div>
        </div>

        <header>
            <h1>Everything2MD</h1>
            <p class="subtitle">轻松将任意文档转换为 Markdown</p>
        </header>

        <main>
            <!-- File Selection -->
            <div class="card">
                <div class="section-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                    源文件与目标路径
                </div>
                <div class="grid">
                    <div class="form-group">
                        <label for="inputPath">输入文件或目录</label>
                        <div class="path-input-group">
                            <input type="text" id="inputPath" placeholder="请选择文件或文件夹..." >
                            <button class="btn btn-secondary" onclick="selectPath('input', 'file')">选文件</button>
                            <button class="btn btn-secondary" onclick="selectPath('input', 'folder')">选目录</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="outputPath">输出目录 (可选)</label>
                        <div class="path-input-group">
                            <input type="text" id="outputPath" placeholder="默认为输入目录..." >
                            <button class="btn btn-secondary" onclick="selectPath('output', 'folder')">选目录</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Configuration -->
            <div class="card">
                <div class="section-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    设置
                </div>
                <div class="grid grid-2">
                    <div class="form-group">
                        <label for="outputFormat">输出格式</label>
                        <select id="outputFormat">
                            <option value="markdown">Markdown</option>
                            <option value="html">HTML</option>
                            <option value="txt">Text</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="logLevel">日志级别</label>
                        <select id="logLevel">
                            <option value="DEBUG">DEBUG</option>
                            <option value="INFO">INFO</option>
                            <option value="WARNING">WARNING</option>
                            <option value="ERROR">ERROR</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="maxJobs">最大并发任务数</label>
                        <input type="number" id="maxJobs" min="1" max="16" value="2">
                    </div>
                    <div class="form-group">
                        <label for="fileFilters">文件过滤 (逗号分隔)</label>
                        <input type="text" id="fileFilters" value="docx,pptx,pdf,txt">
                    </div>
                </div>
                <div class="form-group" style="margin-top: 1.5rem;">
                    <div class="checkbox-group">
                        <input type="checkbox" id="batchProcessing" checked>
                        <label for="batchProcessing" style="color: var(--text-primary);">启用批量处理</label>
                    </div>
                </div>
            </div>

            <!-- Action -->
            <button id="convertBtn" class="btn btn-primary btn-block" onclick="startConversion()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                开始转换
            </button>

            <!-- Logs -->
            <div class="card" style="margin-top: 2rem;">
                <div class="section-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                    控制台输出
                </div>
                <div id="terminal" class="terminal">等待任务...</div>
                <div class="status-bar">
                    <span id="statusText">就绪</span>
                    <span id="loadingIndicator" style="display: none;">处理中...</span>
                </div>
            </div>
        </main>
    </div>

    <script src="script.js?v=20251201-02"></script>
</body>
</html>
