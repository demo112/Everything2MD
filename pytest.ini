[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --cov=src --cov-report=term-missing
markers =
    unit: Unit tests
    integration: Integration tests
    ui: UI automation tests (requires Windows)
    slow: marks tests as slow (deselect with '-m "not slow"')
